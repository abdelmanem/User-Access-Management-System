{% load static %}
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
        <a class="navbar-brand d-flex align-items-center" href="{% url 'dashboard_home' %}">
            <span class="fw-bold">UAMS</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNavbar">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link{% if request.path|slice:':10' == '/dashboard' %} active{% endif %}" href="{% url 'dashboard_home' %}">
                        <i class="fa-solid fa-chart-line me-1"></i> Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'accounts:user_list' %}">
                        <i class="fa-solid fa-users me-1"></i> Users
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'departments:department_list' %}">
                        <i class="fa-solid fa-sitemap me-1"></i> Departments
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'systems:system_list' %}">
                        <i class="fa-solid fa-server me-1"></i> Systems
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'access_management:access_assignment_list' %}">
                        <i class="fa-solid fa-key me-1"></i> Access
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'data_import_export:home' %}">
                        <i class="fa-solid fa-file-import me-1"></i> Import/Export
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link{% if request.path|slice:':19' == '/dashboard/reports' %} active{% endif %}" href="{% url 'reports' %}">
                        <i class="fa-solid fa-chart-pie me-1"></i> Reports
                    </a>
                </li>
            </ul>
            <ul class="navbar-nav ms-auto">
                {% if user.is_authenticated %}
                <li class="nav-item d-flex align-items-center me-3 text-white-50">
                    <i class="fa-solid fa-circle-user me-2"></i>
                    <span class="small">{{ user.get_full_name|default:user.username }}</span>
                </li>
                <li class="nav-item">
                    <form method="post" action="{% url 'accounts:logout' %}" class="d-inline">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-sm btn-light">
                            <i class="fa-solid fa-right-from-bracket me-1"></i> Logout
                        </button>
                    </form>
                </li>
                {% else %}
                <li class="nav-item">
                    <a class="btn btn-sm btn-outline-light" href="{% url 'accounts:login' %}">
                        <i class="fa-solid fa-right-to-bracket me-1"></i> Login
                    </a>
                </li>
                {% endif %}
            </ul>
        </div>
    </div>
</nav>
