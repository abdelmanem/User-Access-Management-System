version: '3.9'
services:
  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - ./env.example
    volumes:
      - .:/app
    depends_on:
      - db
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: uams
      POSTGRES_USER: uams
      POSTGRES_PASSWORD: uams
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:


