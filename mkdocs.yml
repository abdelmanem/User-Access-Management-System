site_name: User Access Management System
site_description: >
  Comprehensive governance, provisioning, and compliance documentation
  for the User Access Management System (UAMS).
repo_url: https://github.com/abdelmanem/User-Access-Management-System
docs_dir: doc
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
nav:
  - Home: home.md
  - Getting Started:
      - Introduction: introduction.md
      - Getting Started: getting_started.md
      - Installation & Upgrade: installation_upgrade.md
      - Quick Start Guide: USER_GUIDE.md
      - HTML User Guide: user_guide.html
  - Features & Capabilities:
      - Features: features.md
      - Data Model: data_model.md
  - Configuration:
      - Configuration: configuration.md
      - Customization: customization.md
      - HTTPS/SSL Setup: HTTPS_SETUP.md
  - Administration:
      - Administration: administration.md
      - Best Practices: best_practices.md
  - Development:
      - Developer Guide: DEV_GUIDE.md
      - Development: development.md
      - Reference: reference.md
      - Plugins: plugins.md
  - Integrations:
      - Integrations Overview: integrations.md
      - Additional Integrations:
          - Integrations Overview: additional_integrations/integrations.md
          - Diode Integration: additional_integrations/diode.md
          - Copilot Integration: additional_integrations/copilot.md
          - MCP Server: additional_integrations/mcp_server.md
          - Extensions: additional_integrations/extensions.md
  - Enterprise & Cloud:
      - Enterprise Features: enterprise.md
      - Cloud Deployment: cloud.md
  - Compliance Playbooks:
      - Access:
          - Administrator Access (4.3): ADMINISTRATOR_ACCESS_4_3_GOVERNANCE.md
          - Access Approval (4.6): ACCESS_APPROVAL_COMPLIANCE_4_6.md
          - Quarterly Access Review (4.5): QUARTERLY_ACCESS_REVIEW_4_5.md
          - Default Account Management (4.7): DEFAULT_ACCOUNT_MANAGEMENT_4_7.md
          - Change Management (4.4): CHANGE_MANAGEMENT_4_4_PROCESS.md
      - Service Account Governance: SERVICE_ACCOUNT_GOVERNANCE.md
  - Operations:
      - Policy Drift Scheduling: POLICY_DRIFT_SCHEDULING.md
  - Product Information:
      - Product Feature Lifecycle: product_feature_lifecycle.md
      - Release Notes: release_notes.md
  - Deployment:
      - Deployment Guide: DEPLOYMENT.md
      - HTTPS/SSL Setup: HTTPS_SETUP.md
extra_css:
  - extra.css
markdown_extensions:
  - admonition
  - codehilite
  - footnotes
  - tables
  - toc:
      permalink: true

